# .gitlab-ci.yml — root CI config; layout from the LeiCraftMC Style Guide (docs/13-git-and-ci.md).
# Uses oven/bun everywhere; includes .gitlab/ci/testing.yml and .gitlab/ci/build.yml.

# Hub-specific: run pipelines for pushes and merge requests only.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

stages:
  - test
  - build

variables:
  GIT_DEPTH: "20"
  BUN_INSTALL_CACHE: "$CI_PROJECT_DIR/.bun"

include:
  - local: ".gitlab/ci/testing.yml"
  - local: ".gitlab/ci/build.yml"
